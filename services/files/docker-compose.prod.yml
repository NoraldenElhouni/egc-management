# Production overrides for the EGC server (files.engroup.ly).
# Used together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Nginx (aaPanel) on the host terminates TLS and proxies to 127.0.0.1:8002,
# so the service is never published on a public port.
services:
  files:
    env_file: !override
      - /opt/files-service/shared/.env
    ports: !override
      - "127.0.0.1:8002:8002"
    volumes: !override
      - /opt/files-service/shared/storage:/data
